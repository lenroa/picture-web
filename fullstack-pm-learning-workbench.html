<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>准全栈产品经理学习工作台</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #20242d;
      --muted: #677083;
      --line: #dde3ee;
      --blue: #246bfe;
      --blue-soft: #e8efff;
      --green: #15845a;
      --green-soft: #e4f6ef;
      --amber: #a15c00;
      --amber-soft: #fff0d6;
      --rose: #bf3b55;
      --rose-soft: #ffe7ed;
      --shadow: 0 14px 36px rgba(29, 40, 62, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(36, 107, 254, 0.06), transparent 36%),
        linear-gradient(315deg, rgba(21, 132, 90, 0.07), transparent 34%),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 40px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .title-block p {
      margin: 10px 0 0;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.7;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .icon-button,
    .primary-button,
    .ghost-button {
      min-height: 38px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      box-shadow: 0 1px 0 rgba(29, 40, 62, 0.04);
    }

    .icon-button {
      width: 38px;
      padding: 0;
      font-size: 18px;
    }

    .primary-button {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
    }

    .ghost-button:hover,
    .icon-button:hover {
      border-color: #b8c5d8;
      background: #f9fbff;
    }

    .layout {
      display: grid;
      grid-template-columns: 276px minmax(0, 1fr) 330px;
      gap: 16px;
      align-items: start;
    }

    .panel,
    .week-card,
    .day-row,
    .exercise,
    .evidence-item {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 14px;
    }

    .panel h2,
    .panel h3,
    .exercise h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .panel small {
      color: var(--muted);
    }

    .week-nav {
      display: grid;
      gap: 10px;
    }

    .week-button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      padding: 12px;
      text-align: left;
      display: grid;
      gap: 7px;
      min-height: 96px;
    }

    .week-button.active {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .week-kicker {
      color: var(--muted);
      font-size: 12px;
    }

    .week-name {
      font-weight: 750;
      line-height: 1.35;
    }

    .mini-progress {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8edf5;
    }

    .mini-progress span,
    .progress-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green));
      transition: width 0.25s ease;
    }

    .hero-panel {
      min-height: 242px;
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
      gap: 18px;
      align-items: stretch;
      overflow: hidden;
      position: relative;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    .hero-copy h2 {
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.16;
      margin: 0;
      letter-spacing: 0;
    }

    .hero-copy p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .focus-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: #23405f;
      background: #eef4fb;
      border: 1px solid #d8e3f1;
      white-space: nowrap;
    }

    .visual {
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 28% 22%, rgba(36, 107, 254, 0.2), transparent 22%),
        linear-gradient(145deg, #17202f 0%, #273851 52%, #f0c879 52%, #f4d99c 100%);
      position: relative;
      overflow: hidden;
      min-height: 210px;
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.16) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.16) 1px, transparent 1px);
      background-size: 26px 26px;
    }

    .node {
      position: absolute;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255,255,255,0.7);
      padding: 9px 10px;
      color: #17202f;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.18);
    }

    .node.one { top: 32px; left: 28px; }
    .node.two { top: 84px; right: 24px; }
    .node.three { bottom: 30px; left: 46px; }

    .connector {
      position: absolute;
      height: 2px;
      background: rgba(255, 255, 255, 0.72);
      transform-origin: left center;
    }

    .connector.a { width: 116px; top: 78px; left: 94px; transform: rotate(13deg); }
    .connector.b { width: 130px; top: 132px; left: 108px; transform: rotate(-24deg); }

    .week-card {
      padding: 16px;
      margin-top: 16px;
    }

    .resource-panel {
      margin-top: 16px;
      padding: 16px;
    }

    .week-card header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }

    .week-card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
    }

    .week-card p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .days {
      display: grid;
      gap: 10px;
    }

    .day-row {
      padding: 12px;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 12px;
      box-shadow: none;
    }

    .check {
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid #b8c5d8;
      border-radius: 6px;
      align-self: start;
      margin: 2px 0 0;
      display: grid;
      place-items: center;
      background: white;
    }

    .check:checked {
      border-color: var(--green);
      background: var(--green);
    }

    .check:checked::after {
      content: "✓";
      color: white;
      font-weight: 900;
      font-size: 16px;
      line-height: 1;
    }

    .day-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-weight: 750;
    }

    .day-title span:first-child {
      color: var(--blue);
    }

    .day-row ul {
      margin: 8px 0 0;
      padding-left: 18px;
      color: #3c4658;
      line-height: 1.65;
    }

    .day-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .resource-button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcff;
      color: #2a3b57;
      min-height: 32px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .resource-button.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #174cb3;
      font-weight: 700;
    }

    .resource-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .resource-header p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .resource-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcff;
      padding: 12px;
      min-height: 122px;
      display: grid;
      align-content: start;
      gap: 7px;
    }

    .resource-card a {
      color: var(--blue);
      font-weight: 750;
      text-decoration: none;
      line-height: 1.35;
    }

    .resource-card a:hover {
      text-decoration: underline;
    }

    .resource-kind {
      width: fit-content;
      border-radius: 999px;
      background: #eef4fb;
      color: #526077;
      font-size: 12px;
      padding: 4px 8px;
    }

    .resource-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .exercise {
      padding: 14px;
      box-shadow: none;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .assistant-card {
      grid-column: 1 / -1;
    }

    .assistant-config {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px;
      gap: 10px;
    }

    .chat-window {
      min-height: 260px;
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fbff;
      padding: 12px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .chat-message {
      width: min(86%, 720px);
      border-radius: var(--radius);
      padding: 10px 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      border: 1px solid var(--line);
    }

    .chat-message.user {
      justify-self: end;
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    .chat-message.assistant {
      justify-self: start;
      background: white;
      color: var(--ink);
    }

    .chat-message.system {
      justify-self: center;
      width: 100%;
      background: var(--amber-soft);
      color: #563300;
      border-color: #ffd59a;
      font-size: 13px;
    }

    .chat-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .chat-input-row textarea {
      min-height: 76px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcff;
      color: var(--ink);
      padding: 10px 11px;
      outline: none;
      min-height: 40px;
    }

    textarea {
      min-height: 102px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(36, 107, 254, 0.12);
    }

    .split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .output {
      white-space: pre-wrap;
      min-height: 148px;
      border: 1px dashed #b8c5d8;
      border-radius: var(--radius);
      background: #f8fbff;
      padding: 12px;
      color: #283348;
      line-height: 1.6;
      overflow: auto;
    }

    .progress-panel {
      position: sticky;
      top: 16px;
      display: grid;
      gap: 12px;
    }

    .score {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .ring {
      width: 88px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--blue) var(--angle), #e8edf5 0);
      position: relative;
      font-weight: 850;
      font-size: 20px;
    }

    .ring::before {
      content: "";
      width: 62px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: white;
      position: absolute;
    }

    .ring span {
      position: relative;
    }

    .progress-bar {
      height: 10px;
      border-radius: 999px;
      background: #e8edf5;
      overflow: hidden;
      margin-top: 8px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 10px;
      background: #fbfcff;
    }

    .metric b {
      display: block;
      font-size: 20px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .today-box {
      background: var(--amber-soft);
      border: 1px solid #ffd59a;
      border-radius: var(--radius);
      padding: 12px;
      color: #563300;
      line-height: 1.55;
    }

    .evidence-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .evidence-item {
      box-shadow: none;
      padding: 10px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .evidence-item input {
      margin-top: 1px;
    }

    .note-area {
      min-height: 150px;
    }

    .footer-space {
      height: 28px;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #20242d;
      color: #fff;
      border-radius: var(--radius);
      padding: 10px 12px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 5;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .progress-panel {
        grid-column: 1 / -1;
        position: static;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 840px) {
      .app {
        padding: 14px;
      }

      .topbar,
      .layout,
      .hero-panel,
      .tools-grid,
      .resource-grid,
      .assistant-config,
      .chat-input-row,
      .split,
      .progress-panel {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .week-nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .week-button {
        min-height: 116px;
      }
    }

    @media (max-width: 560px) {
      .week-nav,
      .metric-grid {
        grid-template-columns: 1fr;
      }

      .hero-panel,
      .week-card,
      .panel {
        padding: 12px;
      }

      .day-row {
        grid-template-columns: 30px minmax(0, 1fr);
      }
    }

    /* Course-style layout inspired by Khan Academy: quiet navigation, clear units, lesson rows. */
    body {
      background: #f6f7f9;
    }

    .app {
      width: min(1180px, 100%);
      padding: 28px 22px 44px;
    }

    .topbar {
      align-items: start;
      margin-bottom: 22px;
      padding-bottom: 20px;
      border-bottom: 1px solid #dfe4ec;
    }

    .title-block h1 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 800;
      color: #151922;
    }

    .title-block p {
      max-width: 720px;
      margin-top: 12px;
      font-size: 16px;
      line-height: 1.75;
    }

    .layout {
      grid-template-columns: 286px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .layout > section {
      grid-column: 2;
      grid-row: 1 / span 2;
      display: grid;
      gap: 18px;
    }

    .progress-panel {
      grid-column: 1;
      grid-row: 2;
      position: sticky;
      top: 18px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .panel,
    .week-card,
    .day-row,
    .exercise,
    .evidence-item {
      background: #fff;
      border: 1px solid #dfe4ec;
      border-radius: 8px;
      box-shadow: none;
    }

    .panel {
      padding: 16px;
    }

    .layout > aside.panel:first-child {
      position: sticky;
      top: 18px;
    }

    .panel h2,
    .panel h3,
    .exercise h3 {
      font-size: 15px;
      font-weight: 800;
      color: #151922;
    }

    .week-nav {
      margin-top: 12px;
      gap: 6px;
    }

    .week-button {
      min-height: auto;
      padding: 12px;
      border-color: transparent;
      border-left: 4px solid transparent;
      border-radius: 6px;
      background: transparent;
      gap: 8px;
      box-shadow: none;
    }

    .week-button:hover {
      background: #f2f5fa;
      border-color: transparent;
      border-left-color: #cad3e1;
    }

    .week-button.active {
      background: #eef4ff;
      border-color: transparent;
      border-left-color: var(--blue);
    }

    .week-kicker {
      font-size: 12px;
      color: #657083;
    }

    .week-name {
      font-size: 14px;
      color: #1d2533;
    }

    .mini-progress {
      height: 5px;
      background: #e6ebf2;
    }

    .hero-panel {
      min-height: auto;
      padding: 0 0 18px;
      display: block;
      border: 0;
      border-bottom: 1px solid #dfe4ec;
      border-radius: 0;
      background: transparent;
    }

    .hero-copy {
      gap: 14px;
    }

    .hero-copy h2 {
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 850;
      color: #151922;
    }

    .hero-copy p {
      max-width: 780px;
      font-size: 15px;
    }

    .visual {
      display: none;
    }

    .tag {
      border: 1px solid #d5deeb;
      background: #f4f7fb;
      color: #39485d;
      border-radius: 999px;
      padding: 5px 9px;
    }

    .week-card,
    .resource-panel,
    .exercise {
      margin-top: 0;
      padding: 18px;
    }

    .week-card header {
      padding-bottom: 14px;
      border-bottom: 1px solid #e5e9f0;
      margin-bottom: 0;
    }

    .week-card h2 {
      font-size: 20px;
      font-weight: 850;
    }

    .week-card p {
      font-size: 14px;
      max-width: 720px;
    }

    .days {
      gap: 0;
    }

    .day-row {
      border: 0;
      border-bottom: 1px solid #e8edf4;
      border-radius: 0;
      grid-template-columns: 34px minmax(0, 1fr);
      padding: 16px 2px;
      background: transparent;
    }

    .day-row:last-child {
      border-bottom: 0;
      padding-bottom: 2px;
    }

    .check {
      width: 22px;
      height: 22px;
      margin-top: 1px;
      border-color: #aeb9c9;
    }

    .day-title {
      align-items: baseline;
      gap: 10px;
      font-size: 15px;
      line-height: 1.45;
    }

    .day-title span:first-child {
      min-width: 44px;
      color: #526077;
      font-size: 13px;
      font-weight: 800;
    }

    .day-row ul {
      margin-top: 6px;
      padding-left: 0;
      list-style: none;
      color: #637086;
      font-size: 14px;
    }

    .resource-button {
      min-height: 30px;
      background: #fff;
      color: var(--blue);
      border-color: #cfd9e8;
      font-weight: 700;
    }

    .resource-button.active {
      background: #eef4ff;
    }

    .resource-header {
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e9f0;
      margin-bottom: 14px;
    }

    .resource-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .resource-card {
      min-height: auto;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 4px 12px;
      align-items: start;
      padding: 12px;
      background: #fff;
      border-color: #e3e8f0;
    }

    .resource-kind {
      grid-row: 1 / span 2;

    const fields = [
      "assistantQuestion", "sqlQuestion", "sqlSchema", "sqlDraft",
      "caseInsight", "caseSolution", "caseBuild", "caseData", "dailyNote"
    ];

    const state = JSON.parse(localStorage.getItem("pmWorkbenchState") || "{}");
    state.activeWeek ??= 0;
    state.activeDay ??= 0;
    state.done ??= {};
    state.evidence ??= {};
    state.fields ??= {};
    state.chat ??= [];

    const $ = (id) => document.getElementById(id);

    function save() {
      localStorage.setItem("pmWorkbenchState", JSON.stringify(state));
    }

    function toast(text) {
      $("toast").textContent = text;
      $("toast").classList.add("show");
      setTimeout(() => $("toast").classList.remove("show"), 1800);
    }

    function renderWeekNav() {
      $("weekNav").innerHTML = weeks.map((week, index) => {
        const done = countWeekDone(index);
        return `
          <button class="week-button ${index === state.activeWeek ? "active" : ""}" type="button" data-week="${index}">
            <span class="week-kicker">第 ${index + 1} 周 · ${done}/7 天</span>
            <span class="week-name">${week.short}</span>
            <span class="mini-progress"><span style="width:${done / 7 * 100}%"></span></span>
          </button>
        `;
      }).join("");

      document.querySelectorAll("[data-week]").forEach(button => {
        button.addEventListener("click", () => {
          state.activeWeek = Number(button.dataset.week);
          state.activeDay = getNextDayIndex(state.activeWeek);
          save();
          render();
        });
      });
    }

    function renderCurrentWeek() {
      const week = weeks[state.activeWeek];
      $("heroTitle").textContent = week.title;
      $("heroText").textContent = week.goal;
      $("weekTitle").textContent = week.title;
      $("weekGoal").textContent = week.goal;
      $("focusTags").innerHTML = week.tags.map(tag => `<span class="tag">${tag}</span>`).join("");

      $("days").innerHTML = week.days.map((day, index) => {
        const key = dayKey(state.activeWeek, index);
        return `
          <div class="day-row">
            <input class="check" type="checkbox" data-day="${index}" ${state.done[key] ? "checked" : ""} aria-label="标记${day[0]}完成">
            <div>
              <div class="day-title"><span>${day[0]}</span><span>${day[1]}</span></div>
              <ul><li>${day[2]}</li></ul>
              <div class="day-actions">
                <button class="resource-button ${index === state.activeDay ? "active" : ""}" type="button" data-resource-day="${index}">看资料</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      document.querySelectorAll("[data-day]").forEach(input => {
        input.addEventListener("change", () => {
          state.done[dayKey(state.activeWeek, Number(input.dataset.day))] = input.checked;
          save();
          render();
        });
      });

      document.querySelectorAll("[data-resource-day]").forEach(button => {
        button.addEventListener("click", () => {
          state.activeDay = Number(button.dataset.resourceDay);
          save();
          render();
          $("resourceTitle").scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    }

    function renderResources() {
      const week = weeks[state.activeWeek];
      const day = week.days[state.activeDay] || week.days[0];
      const resources = getActiveResources();
      $("resourceTitle").textContent = `${week.short} · ${day[0]}资料`;
      $("resourceIntro").textContent = `${day[1]} ${day[2]}`;
      $("resourceGrid").innerHTML = resources.map(([kind, name, url, note]) => {
        const href = url.startsWith("#") ? url : url;
        return `
          <article class="resource-card">
            <span class="resource-kind">${kind}</span>
            <a href="${href}" target="${url.startsWith("#") ? "" : "_blank"}" rel="noreferrer" data-resource-link="${url}">${name}</a>
            <p>${note}</p>
          </article>
        `;
      }).join("");

      document.querySelectorAll("[data-resource-link]").forEach(link => {
        link.addEventListener("click", event => {
          const target = link.dataset.resourceLink;
          if (!target.startsWith("#")) return;
          event.preventDefault();
          scrollToTemplate(target);
        });
      });
    }

    function renderEvidence() {
      $("evidenceList").innerHTML = evidence.map((item, index) => `
        <label class="evidence-item">
          <input type="checkbox" data-evidence="${index}" ${state.evidence[index] ? "checked" : ""}>
          <span>${item}</span>
        </label>
      `).join("");

      document.querySelectorAll("[data-evidence]").forEach(input => {
        input.addEventListener("change", () => {
          state.evidence[input.dataset.evidence] = input.checked;
          save();
          renderProgress();
        });
      });
    }

    function renderChat() {
      const seed = `<div class="chat-message system">你可以在学习过程中随时提问，例如“帮我把点赞功能拆成接口异常分支”或“解释这条 SQL 为什么要 GROUP BY”。API Key 只保存在当前页面内存里。</div>`;
      $("chatWindow").innerHTML = seed + state.chat.map(message => `
        <div class="chat-message ${message.role === "user" ? "user" : "assistant"}">${escapeHtml(message.content)}</div>
      `).join("");
      $("chatWindow").scrollTop = $("chatWindow").scrollHeight;
    }

    function renderProgress() {
      const done = Object.values(state.done).filter(Boolean).length;
      const percent = Math.round(done / 28 * 100);
      const currentWeekDone = countWeekDone(state.activeWeek);
      $("percent").textContent = `${percent}%`;
      $("ring").style.setProperty("--angle", `${percent * 3.6}deg`);
      $("progressText").textContent = `${done} / 28 天完成`;
      $("progressFill").style.width = `${percent}%`;
      $("weekDone").textContent = currentWeekDone;
      $("totalHours").textContent = `${Math.round(done * 1.75)}h`;
      $("todayBox").textContent = getTodaySuggestion();
    }

    function dayKey(week, day) {
      return `${week}-${day}`;
    }

    function countWeekDone(week) {
      return Array.from({ length: 7 }, (_, day) => state.done[dayKey(week, day)]).filter(Boolean).length;
    }

    function getNextDayIndex(week) {
      const next = weeks[week].days.findIndex((_, index) => !state.done[dayKey(week, index)]);
      return next === -1 ? 6 : next;
    }

    function getActiveResources() {
      return dayResources[state.activeWeek]?.[state.activeDay] || dayResources[state.activeWeek]?.[0] || [];
    }

    function scrollToTemplate(target) {
      const map = {
        "#assistant": "assistantQuestion",
        "#sql-template": "sqlQuestion",
        "#case-template": "caseInsight",
        "#coach-prompt": "copyPromptBtn"
      };
      const id = map[target];
      if (!id) return;
      $(id).scrollIntoView({ behavior: "smooth", block: "center" });
      if (target === "#coach-prompt") copyCoachPrompt();
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getTodaySuggestion() {
      const week = weeks[state.activeWeek];
      const next = week.days.findIndex((_, index) => !state.done[dayKey(state.activeWeek, index)]);
      if (next === -1) return "本周已经完成。现在做一次周末检验，把卡点写进复盘。";
      const day = week.days[next];
      return `${day[0]}：${day[1]} ${day[2]}`;
    }

    function hydrateFields() {
      fields.forEach(id => {
        const el = $(id);
        el.value = state.fields[id] || "";
        el.addEventListener("input", () => {
          state.fields[id] = el.value;
          save();
        });
      });
    }

    function render() {
      if (state.activeDay > 6) state.activeDay = 0;
      renderWeekNav();
      renderCurrentWeek();
      renderResources();
      renderEvidence();
      renderChat();
      renderProgress();
    }

    function fillSql() {
      $("sqlQuestion").value ||= "过去30天内，下单金额最高的前10位且账户注册时间超过1年的用户";
      $("sqlSchema").value ||= "users(id, name, created_at)\norders(id, user_id, amount, created_at)";
      $("sqlDraft").value =
`SELECT
  u.id,
  u.name,
  SUM(o.amount) AS total_amount
FROM users u
LEFT JOIN orders o ON o.user_id = u.id
WHERE
  u.created_at < CURRENT_DATE - INTERVAL '1 year'
  AND o.created_at >= CURRENT_DATE - INTERVAL '30 day'
GROUP BY u.id, u.name
ORDER BY total_amount DESC
LIMIT 10;`;
      fields.forEach(id => state.fields[id] = $(id).value);
      save();
      toast("已填入参考 SQL");
    }

    function exportRecord() {
      const done = Object.values(state.done).filter(Boolean).length;
      const checkedEvidence = evidence.filter((_, index) => state.evidence[index]);
      const payload =
`准全栈产品经理学习记录
完成进度：${done}/28 天
当前主题：${weeks[state.activeWeek].title}

作品证据：
${checkedEvidence.length ? checkedEvidence.map(item => `- ${item}`).join("\n") : "- 暂无"}

小助理对话：
${state.chat.length ? state.chat.map(message => `${message.role === "user" ? "我" : "助理"}：${message.content}`).join("\n\n") : "暂无"}

SQL 草稿：
${$("sqlDraft").value || "未填写"}

产品案例：
洞察：${$("caseInsight").value || "未填写"}
方案：${$("caseSolution").value || "未填写"}
实现：${$("caseBuild").value || "未填写"}
验证与数据：${$("caseData").value || "未填写"}

每日复盘：
${$("dailyNote").value || "未填写"}`;
      navigator.clipboard.writeText(payload).then(() => toast("学习记录已复制"));
    }

    function copyCoachPrompt() {
      const prompt = "你是资深后端架构师。请检查我这份API设计是否合理，指出缺漏的字段、未考虑的边界条件和异常分支，并用工程语言给出完整版设计。";
      navigator.clipboard.writeText(prompt).then(() => toast("教练提示词已复制"));
    }

    async function askAssistant() {
      const apiKey = $("deepseekKey").value.trim();
      const question = $("assistantQuestion").value.trim();
      if (!apiKey) {
        toast("请先输入 DeepSeek API Key");
        $("deepseekKey").focus();
        return;
      }
      if (!question) {
        toast("先写下你的问题");
        $("assistantQuestion").focus();
        return;
      }

      const week = weeks[state.activeWeek];
      const day = week.days[state.activeDay];
      const systemPrompt = `你是学习小助理，帮助用户在一个月内建立准全栈产品经理能力。当前阶段：${week.title}，当前任务：${day[0]} ${day[1]} ${day[2]}。回答要具体、结构化、适合产品经理学习工程语言。`;
      state.chat.push({ role: "user", content: question });
      $("assistantQuestion").value = "";
      state.fields.assistantQuestion = "";
      save();
      renderChat();
      $("askAssistantBtn").disabled = true;
      $("askAssistantBtn").textContent = "思考中";

      try {
        const response = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: $("deepseekModel").value,
            messages: [
              { role: "system", content: systemPrompt },
              ...state.chat.slice(-10)
            ],
            temperature: 0.4
          })
        });

        if (!response.ok) {
          const detail = await response.text();
          throw new Error(`DeepSeek 返回 ${response.status}：${detail.slice(0, 220)}`);
        }

        const data = await response.json();
        const answer = data.choices?.[0]?.message?.content || "没有收到可读回复。";
        state.chat.push({ role: "assistant", content: answer });
        save();
        renderChat();
      } catch (error) {
        state.chat.push({ role: "assistant", content: `调用失败：${error.message}\n\n请检查 API Key、网络连接，或确认浏览器是否允许从本地 HTML 直接请求 DeepSeek API。` });
        save();
        renderChat();
      } finally {
        $("askAssistantBtn").disabled = false;
        $("askAssistantBtn").textContent = "发送";
      }
    }

    function copyResourceList() {
      const week = weeks[state.activeWeek];
      const day = week.days[state.activeDay];
      const lines = getActiveResources().map(([kind, name, url, note]) => `- ${kind}：${name} ${url}\n  ${note}`);
      const payload = `${week.title} ${day[0]}\n${day[1]} ${day[2]}\n\n${lines.join("\n")}`;
      navigator.clipboard.writeText(payload).then(() => toast("今日资料已复制"));
    }

    $("fillSqlBtn").addEventListener("click", fillSql);
    $("askAssistantBtn").addEventListener("click", askAssistant);
    $("assistantQuestion").addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") askAssistant();
    });
    $("exportBtn").addEventListener("click", exportRecord);
    $("copyPromptBtn").addEventListener("click", copyCoachPrompt);
    $("copyResourceBtn").addEventListener("click", copyResourceList);
    $("markWeekBtn").addEventListener("click", () => {
      for (let day = 0; day < 7; day += 1) state.done[dayKey(state.activeWeek, day)] = true;
      save();
      render();
      toast("本周已标记完成");
    });
    $("resetBtn").addEventListener("click", () => {
      if (!confirm("确定重置本页保存的学习进度和输入内容吗？")) return;
      localStorage.removeItem("pmWorkbenchState");
      location.reload();
    });

    hydrateFields();
    render();
  </script>
</body>
</html>
