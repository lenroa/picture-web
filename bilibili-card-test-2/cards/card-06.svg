<text x="72" y="210" font-size="28" font-weight="700" fill="#C5B642" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">成年自救</text>
<text x="828" y="210" font-size="24" fill="#64736A" text-anchor="end" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">6/7</text>
<text x="72" y="290" font-size="56" font-weight="800" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">长大后，你可以重新养育自己</text>
<line x1="72" y1="394" x2="828" y2="394" stroke="#D9DED6" stroke-width="2"/>
<text x="72" y="452" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 童年没得选，但成年后可以改变回应方式</text>
<text x="72" y="506" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 放下对自己的鞭打，去抱住那个受伤的小孩</text>
<text x="72" y="560" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 看见委屈、承认痛苦，才有机会停止内耗</text>
<line x1="72" y1="1052" x2="828" y2="1052" stroke="#D9DED6" stroke-width="2"/>
<text x="72" y="1096" font-size="24" font-weight="400" fill="#64736A" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">字幕后段：原生家庭与自我养育</text>
