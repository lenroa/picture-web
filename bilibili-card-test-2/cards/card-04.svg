<circle cx="134" cy="812" r="13" fill="#C5B642" opacity="0.82"/>
<circle cx="744" cy="1010" r="10" fill="#C5B642" opacity="0.8"/>
<rect x="48" y="66" width="804" height="1080" rx="26" fill="#EEF2EC" fill-opacity="0.92" stroke="#D9DED6" stroke-width="1.5"/>
<rect x="72" y="174" width="92" height="6" fill="#5D7A65" opacity="0.88"/>
<text x="72" y="210" font-size="28" font-weight="700" fill="#C5B642" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">苛刻父母</text>
<text x="828" y="210" font-size="24" fill="#64736A" text-anchor="end" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">4/7</text>
<text x="72" y="290" font-size="56" font-weight="800" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">最狠的批判，往往来自自己脑</text>
<text x="72" y="364" font-size="56" font-weight="800" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">子里</text>
<line x1="72" y1="468" x2="828" y2="468" stroke="#D9DED6" stroke-width="2"/>
<text x="72" y="526" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 外界可能只批评几句，你却在心里审判自己</text>
<text x="72" y="580" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 一次失误会被放大成我彻底失败了</text>
<text x="72" y="634" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 很多人的内耗，是把严苛要求内化成了鞭子</text>
<line x1="72" y1="1052" x2="828" y2="1052" stroke="#D9DED6" stroke-width="2"/>
<text x="72" y="1096" font-size="24" font-weight="400" fill="#64736A" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">字幕概念：挑剔型父母状态</text>
</svg>