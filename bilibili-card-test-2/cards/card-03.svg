<text x="72" y="290" font-size="56" font-weight="800" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">讨好型人格，本质是害怕关系</text>
<text x="72" y="364" font-size="56" font-weight="800" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">破裂</text>
