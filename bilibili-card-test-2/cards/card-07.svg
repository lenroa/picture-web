<line x1="72" y1="394" x2="828" y2="394" stroke="#D9DED6" stroke-width="2"/>
<text x="72" y="452" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 遇到冲突时，你是在讨好，还是在自责</text>
<text x="72" y="506" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 你不需要马上变好，但要开始诚实面对自己</text>
<text x="72" y="560" font-size="34" font-weight="600" fill="#273238" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">• 能把自己从泥潭里拉出来的，终究是愿意站起</text>
<text x="72" y="614" font-size="34" font-weight="400" fill="#64736A" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">  来的你</text>
<rect x="72" y="642" width="756" height="118" rx="18" fill="#B8C8D0" fill-opacity="0.42" stroke="#D9DED6"/>
<text x="98" y="676" font-size="28" font-weight="400" fill="#64736A" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">适合睡前复盘：今天有没有一个瞬间，我又把自己的感</text>
<text x="98" y="716" font-size="28" font-weight="400" fill="#64736A" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">受放到最后？</text>
