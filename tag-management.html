<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>标签管理系统</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #dce3ec;
      --line-strong: #c7d3e0;
      --ink: #172033;
      --muted: #647287;
      --subtle: #8a97a8;
      --blue: #2563eb;
      --blue-strong: #1d4ed8;
      --blue-soft: #eaf1ff;
      --green: #0f9f6e;
      --green-soft: #e7f8f1;
      --red: #d14343;
      --red-soft: #fff0f0;
      --amber: #b7791f;
      --amber-soft: #fff7df;
      --shadow: 0 18px 46px rgba(30, 41, 59, 0.10);
      --radius: 8px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 1120px;
      margin: 0;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 72px 1fr;
      min-height: 100vh;
    }

    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 18px 12px;
      background: #111827;
      color: #e5e7eb;
    }

    .logo {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 8px;
      background: #2563eb;
      font-weight: 800;
      letter-spacing: 0;
    }

    .rail button {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 8px;
      background: transparent;
      color: #9ca3af;
      font-size: 18px;
    }

    .rail button.active {
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      height: 64px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .crumb {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .crumb strong {
      color: var(--ink);
      font-size: 15px;
    }

    .ops {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .avatar {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      background: #edf2f7;
      color: #334155;
      font-weight: 700;
    }

    .workspace {
      display: grid;
      grid-template-columns: 420px minmax(620px, 1fr);
      gap: 18px;
      padding: 20px 28px 28px;
      min-height: calc(100vh - 64px);
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 66px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      min-width: 0;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1,
    h2 {
      font-size: 18px;
      letter-spacing: 0;
    }

    .hint {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .primary,
    .secondary,
    .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 34px;
      padding: 0 13px;
      border-radius: 6px;
      white-space: nowrap;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .primary {
      background: var(--blue);
      color: #fff;
    }

    .primary:hover {
      background: var(--blue-strong);
    }

    .secondary {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--ink);
    }

    .secondary:hover {
      border-color: #aebdce;
      background: var(--surface-soft);
    }

    .ghost {
      background: transparent;
      color: var(--muted);
    }

    .ghost:hover {
      background: var(--surface-soft);
      color: var(--ink);
    }

    .icon {
      display: inline-grid;
      width: 16px;
      height: 16px;
      place-items: center;
      font-size: 14px;
      line-height: 1;
    }

    .tree-toolbar {
      display: grid;
      grid-template-columns: 1fr 76px;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      color: var(--subtle);
      transform: translateY(-50%);
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input[type="text"],
    input[type="number"] {
      height: 36px;
      padding: 0 11px;
    }

    .input-wrap input {
      padding-left: 36px;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
      padding: 10px 11px;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .tree {
      height: calc(100vh - 187px);
      overflow: auto;
      padding: 12px 10px 18px;
    }

    .tree ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree .children {
      display: none;
      margin-left: 20px;
    }

    .tree li.open > .children {
      display: block;
    }

    .tree-row {
      display: grid;
      grid-template-columns: 24px 24px 1fr auto;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      margin: 2px 0;
      padding: 0 9px;
      border-radius: 6px;
      color: var(--ink);
      user-select: none;
    }

    .tree-row:hover {
      background: #f1f5f9;
    }

    .tree-row.selected {
      background: var(--blue-soft);
      color: var(--blue-strong);
      font-weight: 700;
    }

    .tree-row.deprecated {
      color: var(--subtle);
    }

    .twisty,
    .node-icon {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .twisty {
      background: transparent;
    }

    .twisty.hidden {
      visibility: hidden;
    }

    .node-icon {
      background: #eef2f7;
      color: #526173;
    }

    .tree-row.selected .node-icon {
      background: #dbeafe;
      color: var(--blue-strong);
    }

    .node-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .count {
      min-width: 22px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #eef2f7;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .detail-body {
      height: calc(100vh - 151px);
      overflow: auto;
      padding: 20px;
    }

    .summary-band {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .summary-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .badge-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 8px;
      background: var(--blue-soft);
      color: var(--blue-strong);
      font-weight: 800;
    }

    .summary-title h3 {
      overflow: hidden;
      color: var(--ink);
      font-size: 22px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-title p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: #087858;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pill.deprecated {
      background: var(--red-soft);
      color: var(--red);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .stat {
      min-height: 86px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 12px;
      overflow: hidden;
      font-size: 17px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-head h3 {
      font-size: 15px;
    }

    .description {
      min-height: 72px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: #334155;
      line-height: 1.6;
    }

    .rule-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 12px;
    }

    .rule {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 74px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .rule strong {
      display: block;
      font-size: 14px;
    }

    .rule span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .switch-read {
      position: relative;
      flex: 0 0 auto;
      width: 46px;
      height: 24px;
      border-radius: 999px;
      background: #cbd5e1;
    }

    .switch-read::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.22);
      transition: transform 140ms ease;
    }

    .switch-read.on {
      background: var(--blue);
    }

    .switch-read.on::after {
      transform: translateX(22px);
    }

    .children-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .child-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 66px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .child-item strong {
      display: block;
      font-size: 14px;
    }

    .child-item span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      display: grid;
      min-height: 190px;
      place-items: center;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface-soft);
      text-align: center;
    }

    .empty-symbol {
      display: grid;
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 50%;
      background: #eef2f7;
      color: var(--muted);
      font-size: 22px;
    }

    .empty p {
      color: var(--muted);
      font-size: 14px;
    }

    .empty .secondary {
      margin-top: 14px;
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(15, 23, 42, 0.46);
    }

    .modal-layer.show {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      overflow: hidden;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.28);
    }

    .modal-head,
    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h3 {
      font-size: 17px;
    }

    .modal-body {
      display: grid;
      gap: 16px;
      padding: 18px 20px 20px;
    }

    .modal-foot {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
      background: var(--surface-soft);
    }

    .form-row {
      display: grid;
      gap: 8px;
    }

    .form-row label {
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .required {
      color: var(--red);
    }

    .radio-group,
    .switch-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .radio-choice {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
    }

    .radio-choice input {
      accent-color: var(--blue);
    }

    .stepper {
      display: grid;
      grid-template-columns: 38px 96px 38px;
      width: max-content;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .stepper button {
      height: 36px;
      background: #f8fafc;
      color: var(--ink);
      font-size: 18px;
    }

    .stepper input {
      height: 36px;
      border: 0;
      border-left: 1px solid var(--line-strong);
      border-right: 1px solid var(--line-strong);
      border-radius: 0;
      text-align: center;
    }

    .switch-field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 148px;
      color: #334155;
      font-size: 13px;
      cursor: pointer;
    }

    .switch-field input {
      position: absolute;
      opacity: 0;
    }

    .switch-ui {
      position: relative;
      width: 42px;
      height: 23px;
      border-radius: 999px;
      background: #cbd5e1;
      transition: background 140ms ease;
    }

    .switch-ui::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.22);
      transition: transform 140ms ease;
    }

    .switch-field input:checked + .switch-ui {
      background: var(--blue);
    }

    .switch-field input:checked + .switch-ui::after {
      transform: translateX(19px);
    }

    .error {
      min-height: 17px;
      color: var(--red);
      font-size: 12px;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      display: none;
      min-width: 220px;
      padding: 12px 14px;
      border: 1px solid #b7ebd3;
      border-radius: 6px;
      background: #f0fdf7;
      color: #087858;
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 700;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 1240px) {
      .workspace {
        grid-template-columns: 390px minmax(620px, 1fr);
        padding: 18px;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(160px, 1fr));
      }

      .children-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="系统导航">
      <div class="logo">AI</div>
      <button class="active" title="标签配置" aria-label="标签配置">⌘</button>
      <button title="模板管理" aria-label="模板管理">▦</button>
      <button title="订单解析" aria-label="订单解析">◎</button>
      <button title="系统设置" aria-label="系统设置">⚙</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumb">
          <span>订单交付配置</span>
          <span>/</span>
          <strong>标签匹配规则</strong>
        </div>
        <div class="ops">
          <span>运营配置人员</span>
          <div class="avatar">配</div>
        </div>
      </header>

      <div class="workspace">
        <section class="panel" aria-label="标签管理">
          <div class="panel-head">
            <div class="panel-title">
              <h1>标签管理</h1>
              <p class="hint">维护 AI 解析订单后的模板匹配标签体系</p>
            </div>
            <button class="primary" id="addRootBtn" type="button">
              <span class="icon">＋</span>
              新增节点
            </button>
          </div>

          <div class="tree-toolbar">
            <div class="input-wrap">
              <span class="icon">⌕</span>
              <input id="searchInput" type="text" placeholder="输入标签名称搜索">
            </div>
            <button class="secondary" id="searchBtn" type="button">搜索</button>
          </div>

          <nav class="tree" id="tree" aria-label="标签树"></nav>
        </section>

        <section class="panel" aria-label="标签详情">
          <div class="panel-head">
            <div class="panel-title">
              <h2>标签详情</h2>
              <p class="hint">查看当前节点字段、规则与子标签</p>
            </div>
            <button class="secondary" id="editBtn" type="button">
              <span class="icon">✎</span>
              编辑节点
            </button>
          </div>

          <div class="detail-body">
            <div class="summary-band">
              <div class="summary-title">
                <div class="badge-icon" id="detailInitial">男</div>
                <div>
                  <h3 id="detailName">男</h3>
                  <p id="detailPath">适配性别 / 男</p>
                </div>
              </div>
              <div class="status-pill" id="detailStatus"><span class="status-dot"></span>正常使用</div>
            </div>

            <div class="stats">
              <div class="stat">
                <span>标签层级</span>
                <strong id="detailLevel">2</strong>
              </div>
              <div class="stat">
                <span>标签 ID</span>
                <strong id="detailId">tag_20250821105157707625116</strong>
              </div>
              <div class="stat">
                <span>权重</span>
                <strong id="detailWeight">20</strong>
              </div>
              <div class="stat">
                <span>子标签数量</span>
                <strong id="detailChildCount">0</strong>
              </div>
            </div>

            <div class="section">
              <div class="section-head">
                <h3>标签描述</h3>
              </div>
              <div class="description" id="detailDesc">用于匹配男性客户或面向男性收礼人的交付模板。</div>
            </div>

            <div class="section">
              <div class="section-head">
                <h3>匹配规则</h3>
              </div>
              <div class="rule-grid">
                <div class="rule">
                  <div>
                    <strong>命中必用</strong>
                    <span>订单解析命中该标签时，最终模板标签必须包含该标签</span>
                  </div>
                  <span class="switch-read on" id="detailMustHit" aria-hidden="true"></span>
                </div>
                <div class="rule">
                  <div>
                    <strong>未命中禁用</strong>
                    <span>该标签未出现在订单解析结果中时，最终模板标签禁止包含该标签</span>
                  </div>
                  <span class="switch-read" id="detailForbidMiss" aria-hidden="true"></span>
                </div>
              </div>
            </div>

            <div class="section">
              <div class="section-head">
                <h3>子标签</h3>
                <button class="ghost" id="quickChildBtn" type="button">
                  <span class="icon">＋</span>
                  添加子标签
                </button>
              </div>
              <div id="childrenArea"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal-layer" id="modalLayer" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="nodeForm">
      <div class="modal-head">
        <h3 id="modalTitle">新增节点</h3>
        <button class="ghost" id="closeModalBtn" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label for="nameField">标签名称 <span class="required">*</span></label>
          <input id="nameField" type="text" placeholder="请输入标签名称">
          <div class="error" id="nameError"></div>
        </div>

        <div class="form-row">
          <label for="descField">标签描述</label>
          <textarea id="descField" placeholder="可填写标签用途说明"></textarea>
        </div>

        <div class="form-row">
          <label>是否弃用 <span class="required">*</span></label>
          <div class="radio-group">
            <label class="radio-choice">
              <input type="radio" name="status" value="active" checked>
              正常使用
            </label>
            <label class="radio-choice">
              <input type="radio" name="status" value="deprecated">
              弃用
            </label>
          </div>
        </div>

        <div class="form-row">
          <label for="weightField">权重 <span class="required">*</span></label>
          <div class="stepper">
            <button id="minusBtn" type="button" aria-label="减少权重">−</button>
            <input id="weightField" type="number" min="0" max="100" step="1">
            <button id="plusBtn" type="button" aria-label="增加权重">＋</button>
          </div>
          <div class="error" id="weightError"></div>
        </div>

        <div class="form-row">
          <label>规则开关</label>
          <div class="switch-row">
            <label class="switch-field">
              <input id="mustHitField" type="checkbox">
              <span class="switch-ui"></span>
              命中必用
            </label>
            <label class="switch-field">
              <input id="forbidMissField" type="checkbox">
              <span class="switch-ui"></span>
              未命中禁用
            </label>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="secondary" id="cancelBtn" type="button">取消</button>
        <button class="primary" type="submit">提交</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast">已保存并刷新标签详情</div>

  <script>
    const tagData = [
      {
        id: "tag_20250821105100000000001",
        name: "适配年龄阶段",
        desc: "按客户或收礼人的年龄阶段匹配模板表达方式。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      },
      {
        id: "tag_20250821105100000000002",
        name: "适配性别",
        desc: "按客户性别或收礼对象性别匹配适合的交付模板。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: true,
        children: [
          {
            id: "tag_20250821105157707625116",
            name: "男",
            desc: "用于匹配男性客户或面向男性收礼人的交付模板。",
            status: "active",
            weight: 20,
            mustHit: true,
            forbidMiss: false,
            open: false,
            children: []
          },
          {
            id: "tag_20250821105221470818325",
            name: "女",
            desc: "用于匹配女性客户或面向女性收礼人的交付模板。",
            status: "active",
            weight: 20,
            mustHit: true,
            forbidMiss: false,
            open: false,
            children: []
          },
          {
            id: "tag_20250821105311420833291",
            name: "通用",
            desc: "不区分性别时使用的通用模板标签。",
            status: "active",
            weight: 10,
            mustHit: false,
            forbidMiss: false,
            open: false,
            children: []
          }
        ]
      },
      {
        id: "tag_20250821105100000000003",
        name: "适配宴会类型",
        desc: "按生日宴、婚礼、升学宴、企业宴请等宴会类型匹配模板。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      },
      {
        id: "tag_20250821105100000000004",
        name: "适配介质",
        desc: "按海报、视频、卡片、长图等交付介质匹配模板。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      },
      {
        id: "tag_20250821105100000000005",
        name: "使用场景",
        desc: "按线上分享、现场大屏、伴手礼、朋友圈等使用场景匹配模板。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      },
      {
        id: "tag_20250821105100000000006",
        name: "内容形式",
        desc: "按祝福语、邀请函、答谢词、纪念册等内容形式匹配模板。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      },
      {
        id: "tag_20250821105100000000007",
        name: "适配季节",
        desc: "按春夏秋冬或节令气质匹配模板视觉与文案。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      },
      {
        id: "tag_20250821105100000000008",
        name: "适配元素",
        desc: "按鲜花、气球、蛋糕、礼盒等视觉元素匹配模板。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      },
      {
        id: "tag_20250821105100000000009",
        name: "地域特色",
        desc: "按城市、地域文化、地方风格等匹配模板。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      },
      {
        id: "tag_20250821105100000000010",
        name: "对他说关系",
        desc: "按父母、爱人、朋友、同事等关系匹配表达口吻。",
        status: "active",
        weight: 50,
        mustHit: false,
        forbidMiss: false,
        open: false,
        children: []
      }
    ];

    const treeEl = document.getElementById("tree");
    const modalLayer = document.getElementById("modalLayer");
    const nodeForm = document.getElementById("nodeForm");
    const modalTitle = document.getElementById("modalTitle");
    const nameField = document.getElementById("nameField");
    const descField = document.getElementById("descField");
    const weightField = document.getElementById("weightField");
    const mustHitField = document.getElementById("mustHitField");
    const forbidMissField = document.getElementById("forbidMissField");
    const nameError = document.getElementById("nameError");
    const weightError = document.getElementById("weightError");
    const toast = document.getElementById("toast");
    const searchInput = document.getElementById("searchInput");

    let selectedId = "tag_20250821105157707625116";
    let modalMode = "add";
    let addParentId = null;

    function createId() {
      return "tag_" + new Date().toISOString().replace(/\D/g, "").slice(0, 14) + Math.floor(Math.random() * 900000 + 100000);
    }

    function walk(nodes, visitor, parent = null, level = 1, path = []) {
      for (const node of nodes) {
        const nextPath = [...path, node.name];
        const result = visitor(node, parent, level, nextPath);
        if (result) return result;
        if (node.children.length) {
          const childResult = walk(node.children, visitor, node, level + 1, nextPath);
          if (childResult) return childResult;
        }
      }
      return null;
    }

    function findNode(id) {
      return walk(tagData, (node, parent, level, path) => {
        if (node.id === id) return { node, parent, level, path };
        return null;
      });
    }

    function matchesQuery(node, query) {
      if (!query) return true;
      if (node.name.includes(query)) return true;
      return node.children.some((child) => matchesQuery(child, query));
    }

    function renderTree() {
      const query = searchInput.value.trim();
      const root = document.createElement("ul");
      tagData
        .filter((node) => matchesQuery(node, query))
        .forEach((node) => root.appendChild(renderTreeNode(node, query)));

      treeEl.innerHTML = "";
      treeEl.appendChild(root);
    }

    function renderTreeNode(node, query) {
      const li = document.createElement("li");
      const childCount = node.children.length;
      const row = document.createElement("div");
      const shouldOpen = node.open || Boolean(query);
      li.className = shouldOpen ? "open" : "";
      row.className = "tree-row" + (node.id === selectedId ? " selected" : "") + (node.status === "deprecated" ? " deprecated" : "");

      const twisty = document.createElement("button");
      twisty.type = "button";
      twisty.className = "twisty" + (childCount ? "" : " hidden");
      twisty.textContent = shouldOpen ? "⌄" : "›";
      twisty.setAttribute("aria-label", shouldOpen ? "收起" : "展开");
      twisty.addEventListener("click", (event) => {
        event.stopPropagation();
        node.open = !node.open;
        renderTree();
      });

      const nodeIcon = document.createElement("span");
      nodeIcon.className = "node-icon";
      nodeIcon.textContent = childCount ? "□" : "•";

      const name = document.createElement("span");
      name.className = "node-name";
      name.textContent = node.name;

      const count = document.createElement("span");
      count.className = "count";
      count.textContent = childCount;

      row.append(twisty, nodeIcon, name, count);
      row.addEventListener("click", () => {
        selectedId = node.id;
        renderTree();
        renderDetail();
      });
      li.appendChild(row);

      if (childCount) {
        const children = document.createElement("ul");
        children.className = "children";
        node.children
          .filter((child) => matchesQuery(child, query))
          .forEach((child) => children.appendChild(renderTreeNode(child, query)));
        li.appendChild(children);
      }
      return li;
    }

    function renderDetail() {
      const found = findNode(selectedId);
      if (!found) return;
      const { node, level, path } = found;

      document.getElementById("detailInitial").textContent = node.name.slice(0, 1);
      document.getElementById("detailName").textContent = node.name;
      document.getElementById("detailPath").textContent = path.join(" / ");
      document.getElementById("detailLevel").textContent = level;
      document.getElementById("detailId").textContent = node.id;
      document.getElementById("detailWeight").textContent = node.weight;
      document.getElementById("detailChildCount").textContent = node.children.length;
      document.getElementById("detailDesc").textContent = node.desc.trim() || "暂无描述";

      const status = document.getElementById("detailStatus");
      status.className = "status-pill" + (node.status === "deprecated" ? " deprecated" : "");
      status.innerHTML = '<span class="status-dot"></span>' + (node.status === "deprecated" ? "弃用" : "正常使用");

      document.getElementById("detailMustHit").className = "switch-read" + (node.mustHit ? " on" : "");
      document.getElementById("detailForbidMiss").className = "switch-read" + (node.forbidMiss ? " on" : "");
      renderChildren(node);
    }

    function renderChildren(node) {
      const area = document.getElementById("childrenArea");
      area.innerHTML = "";
      if (!node.children.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = `
          <div>
            <div class="empty-symbol">＋</div>
            <p>暂无子标签，请先添加本层级下的第一个子标签</p>
            <button class="secondary" type="button" id="emptyAddBtn"><span class="icon">＋</span>添加子标签</button>
          </div>
        `;
        area.appendChild(empty);
        document.getElementById("emptyAddBtn").addEventListener("click", () => openAddModal(selectedId));
        return;
      }

      const grid = document.createElement("div");
      grid.className = "children-grid";
      node.children.forEach((child) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "child-item";
        item.innerHTML = `
          <div>
            <strong>${child.name}</strong>
            <span>权重 ${child.weight} · ${child.status === "deprecated" ? "弃用" : "正常使用"}</span>
          </div>
          <span class="icon">›</span>
        `;
        item.addEventListener("click", () => {
          selectedId = child.id;
          renderTree();
          renderDetail();
        });
        grid.appendChild(item);
      });
      area.appendChild(grid);
    }

    function openAddModal(parentId) {
      modalMode = "add";
      addParentId = parentId;
      modalTitle.textContent = parentId ? "新增子节点" : "新增节点";
      nameField.value = "";
      descField.value = "";
      weightField.value = "50";
      mustHitField.checked = false;
      forbidMissField.checked = false;
      document.querySelector('input[name="status"][value="active"]').checked = true;
      clearErrors();
      modalLayer.classList.add("show");
      nameField.focus();
    }

    function openEditModal() {
      const found = findNode(selectedId);
      if (!found) return;
      const node = found.node;
      modalMode = "edit";
      addParentId = null;
      modalTitle.textContent = "编辑节点";
      nameField.value = node.name;
      descField.value = node.desc;
      weightField.value = node.weight;
      mustHitField.checked = node.mustHit;
      forbidMissField.checked = node.forbidMiss;
      document.querySelector(`input[name="status"][value="${node.status}"]`).checked = true;
      clearErrors();
      modalLayer.classList.add("show");
      nameField.focus();
    }

    function closeModal() {
      modalLayer.classList.remove("show");
    }

    function clearErrors() {
      nameError.textContent = "";
      weightError.textContent = "";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function clampWeight(value) {
      const numeric = Number(value);
      if (Number.isNaN(numeric)) return "";
      return Math.min(100, Math.max(0, numeric));
    }

    function handleSubmit(event) {
      event.preventDefault();
      clearErrors();

      const name = nameField.value.trim();
      const weight = clampWeight(weightField.value);
      let valid = true;

      if (!name) {
        nameError.textContent = "请填写标签名称";
        valid = false;
      }
      if (weight === "") {
        weightError.textContent = "请填写权重";
        valid = false;
      }
      if (!valid) return;

      const values = {
        name,
        desc: descField.value.trim(),
        status: document.querySelector('input[name="status"]:checked').value,
        weight,
        mustHit: mustHitField.checked,
        forbidMiss: forbidMissField.checked
      };

      if (modalMode === "edit") {
        const found = findNode(selectedId);
        Object.assign(found.node, values);
      } else {
        const newNode = {
          id: createId(),
          open: false,
          children: [],
          ...values
        };
        if (addParentId) {
          const parent = findNode(addParentId).node;
          parent.children.push(newNode);
          parent.open = true;
        } else {
          tagData.push(newNode);
        }
        selectedId = newNode.id;
      }

      closeModal();
      renderTree();
      renderDetail();
      showToast("已保存并刷新标签详情");
    }

    document.getElementById("addRootBtn").addEventListener("click", () => openAddModal(null));
    document.getElementById("quickChildBtn").addEventListener("click", () => openAddModal(selectedId));
    document.getElementById("editBtn").addEventListener("click", openEditModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    modalLayer.addEventListener("click", (event) => {
      if (event.target === modalLayer) closeModal();
    });
    document.getElementById("searchBtn").addEventListener("click", renderTree);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") renderTree();
    });
    document.getElementById("minusBtn").addEventListener("click", () => {
      weightField.value = clampWeight(Number(weightField.value || 0) - 1);
    });
    document.getElementById("plusBtn").addEventListener("click", () => {
      weightField.value = clampWeight(Number(weightField.value || 0) + 1);
    });
    weightField.addEventListener("blur", () => {
      weightField.value = clampWeight(weightField.value);
    });
    nodeForm.addEventListener("submit", handleSubmit);

    renderTree();
    renderDetail();
  </script>
</body>
</html>
